name: Build Twinsanity Editor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

            - name: Download ISO from iCloud
        shell: powershell
        run: |
          $icloudId = "09djTEFLDsIwA5QpcMTPjvcDw"

          $body = @{
            shortGUIDs = @(
              @{
                value = $icloudId
              }
            )
          } | ConvertTo-Json -Compress

          Write-Host "Resolving iCloud share link..."

          $response = Invoke-RestMethod `
            -Uri "https://ckdatabasews.icloud.com/database/1/com.apple.cloudkit/production/public/records/resolve" `
            -Method Post `
            -ContentType "application/json" `
            -Body $body

          Write-Host "iCloud response:"
          $response | ConvertTo-Json -Depth 20

          if (-not $response.results) {
            throw "iCloud returned no results."
          }

          $result = $response.results[0]

          if ($result.reason) {
            throw "iCloud error: $($result.reason) [$($result.serverErrorCode)]"
          }

          $record = $result.rootRecord

          if (-not $record) {
            throw "iCloud did not return a rootRecord."
          }

          $fileContent = $record.fields.fileContent.value

          if (-not $fileContent) {
            throw "iCloud did not return fileContent."
          }

          $downloadUrl = $fileContent.downloadURL

          if (-not $downloadUrl) {
            throw "iCloud did not return a downloadURL."
          }

          $filename = $record.fields.filename.value.stringValue

          if (-not $filename) {
            $filename = "Crash Twinsanity.iso"
          }

          Write-Host "Filename: $filename"
          Write-Host "Downloading ISO..."

          Invoke-WebRequest `
            -Uri $downloadUrl `
            -OutFile $filename

          $file = Get-Item $filename

          Write-Host "Downloaded:"
          Write-Host "Name: $($file.Name)"
          Write-Host "Size: $($file.Length) bytes"

      - name: Build mod
        shell: powershell
        run: |
          python tools/build_mod.py

      - name: List output
        shell: powershell
        run: |
          Get-ChildItem -Filter "*[Modded].iso"
      - name: Build Twinsanity Editor
        shell: powershell
        run: |
          python tools/build_mod.py
