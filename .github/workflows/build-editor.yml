name: Build Twinsanity Editor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Download ISO from iCloud
        shell: powershell
        run: |
          python -m pip install icloud-resolver

          Write-Host "Downloading Crash Twinsanity ISO from iCloud..."

          icloud-resolver "https://www.icloud.com/iclouddrive/09djTEFLDsIwA5QpcMTPjvcDw"

          Write-Host ""
          Write-Host "Files in repository root:"
          Get-ChildItem -File | Select-Object Name, Length

      - name: Build mod
        shell: powershell
        run: |
          python tools/build_mod.py

      - name: Show build output
        shell: powershell
        run: |
          Write-Host "ISO files:"
          Get-ChildItem -Filter "*.iso" | Select-Object Name, Length
