name: Build Twinsanity Editor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install icloud-resolver

      - name: Download ISO from iCloud
        shell: powershell
        run: |
          icr -o "." "https://www.icloud.com/iclouddrive/09djTEFLDsIwA5QpcMTPjvcDw"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build modded ISO
        shell: powershell
        run: |
          python tools/build_mod.py

      - name: Find modded ISO
        shell: powershell
        run: |
          $iso = Get-ChildItem -File -Filter "*.iso" |
            Where-Object { $_.Name.EndsWith(" [Modded].iso") } |
            Select-Object -First 1

          if (-not $iso) {
            Write-Error "Modded ISO not found"
            exit 1
          }

          Write-Host "Found modded ISO:"
          Write-Host $iso.FullName
          Write-Host "Size: $([math]::Round($iso.Length / 1GB, 2)) GB"

      - name: Split ISO into parts
        shell: powershell
        run: |
          $iso = Get-ChildItem -File -Filter "*.iso" |
            Where-Object { $_.Name.EndsWith(" [Modded].iso") } |
            Select-Object -First 1

          if (-not $iso) {
            Write-Error "Modded ISO not found"
            exit 1
          }

          [int64]$partSize = 1900MB
          [int32]$bufferSize = 10MB
          $buffer = New-Object byte[] $bufferSize

          $input = [System.IO.File]::OpenRead($iso.FullName)
          $part = 1

          try {
            while ($input.Position -lt $input.Length) {

              $partName = Join-Path $PWD.Path (
                "Crash-Twinsanity-Modded.part{0:D2}" -f $part
              )

              $output = [System.IO.File]::Create($partName)

              try {
                [int64]$remaining = $input.Length - $input.Position

                if ($remaining -gt $partSize) {
                  $remaining = $partSize
                }

                while ($remaining -gt 0) {

                  [int32]$toRead = $buffer.Length

                  if ([int64]$toRead -gt $remaining) {
                    $toRead = [int32]$remaining
                  }

                  $read = $input.Read($buffer, 0, $toRead)

                  if ($read -le 0) {
                    break
                  }

                  $output.Write($buffer, 0, $read)

                  [int64]$remaining = $remaining - $read
                }
              }
              finally {
                $output.Close()
              }

              Write-Host "Created: $partName"
              $part++

            }
          }
          finally {
            $input.Close()
          }

      - name: Verify split files
        shell: powershell
        run: |
          Get-ChildItem -File "Crash-Twinsanity-Modded.part*" |
            ForEach-Object {
              Write-Host "$($_.Name) - $([math]::Round($_.Length / 1GB, 2)) GB"
            }

      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "modded-${{ github.run_number }}"

          gh release create $tag `
            Crash-Twinsanity-Modded.part01 `
            Crash-Twinsanity-Modded.part02 `
            --title "Crash Twinsanity Improved - Modded ISO" `
            --notes "Modded Crash Twinsanity ISO. Download both parts and join them together."
