name: Build Twinsanity Editor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Download ISO from iCloud
        shell: powershell
        run: |
          $icloudId = "09djTEFLDsIwA5QpcMTPjvcDw"

          $body = @{
            shortGUIDs = @(
              @{
                value = $icloudId
              }
            )
          } | ConvertTo-Json -Compress

          Write-Host "Resolving iCloud share link..."

          $response = Invoke-RestMethod `
            -Uri "https://ckdatabasews.icloud.com/database/1/com.apple.cloudkit/production/public/records/resolve" `
            -Method Post `
            -ContentType "application/json" `
            -Body $body

          $downloadUrl = $response.results[0].rootRecord.fields.fileContent.value.downloadURL
          $filename = $response.results[0].rootRecord.fields.filename.value.stringValue

          Write-Host "Filename: $filename"
          Write-Host "Downloading ISO..."

          Invoke-WebRequest `
            -Uri $downloadUrl `
            -OutFile $filename

          Write-Host "Downloaded:"
          Get-Item $filename | Select-Object Name, Length

      - name: Build mod
        shell: powershell
        run: |
          python tools/build_mod.py

      - name: List output
        shell: powershell
        run: |
          Get-ChildItem -Filter "*[Modded].iso"
      - name: Build Twinsanity Editor
        shell: powershell
        run: |
          python tools/build_mod.py
